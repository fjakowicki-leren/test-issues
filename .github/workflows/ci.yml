name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --check bin/leren-cli.js
      - run: node --check src/cli.js && node --check src/git-hook.js && node --check src/lint-liquid.js
      - run: npm test
